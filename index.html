<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Experience with Version Control</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app">
    <div class="control-panel">
      <div id="saveNotification"></div>
      <button id="startExperience" class="primary-button">Start Experience</button>
      <div class="version-controls">
        <h3>Version Control</h3>
        <button id="saveVersion" class="secondary-button">Save Current Version</button>
        <button id="showVersions" class="secondary-button">Show Version History</button>
      </div>
    </div>
    
    <div id="versionModal" class="modal">
      <div class="modal-content">
        <h2>Version History</h2>
        <div id="versionList"></div>
        <div class="modal-footer">
          <button id="clearVersions" class="secondary-button">Clear All Versions</button>
          <button id="closeModal" class="secondary-button">Close</button>
        </div>
      </div>
    </div>

    <div id="experienceContainer" class="experience-container">
      <!-- Dynamic content will be inserted here -->
    </div>
  </div>

  <script type="module" src="js/main.js"></script>

</body>
</html>
